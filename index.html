<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sistema dichiarativo di bridge</title>

  <style>
    :root {
      --text: #263238;
      --muted: #64748b;
      --line: #e5e7eb;
      --hover: #f1f5f9;
      --active: #eaf2ff;
      --blue: #2563eb;

      --club: #008b50;
      --diamond: #e87500;
      --heart: #e63946;
      --spade: #1769e0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: white;
      font-size: 17px;
      line-height: 1.6;
    }

    /* Barra dei tab */

    .tabs-container {
      position: sticky;
      top: 0;
      z-index: 10;
      background: white;
      border-bottom: 1px solid var(--line);
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      overflow-x: auto;
      scrollbar-width: thin;
      scroll-behavior: smooth;
    }

    .tab {
      flex-shrink: 0;
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      color: var(--text);
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab:hover {
      background: var(--hover);
    }

    .tab.active {
      background: var(--active);
      border-color: var(--blue);
      color: var(--blue);
    }

    .tab:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    /* Tabella delle aperture */

.openings-table {
  width: 100%;
  max-width: 1000px;
  border-collapse: collapse;
  margin-top: 8px;
}

.openings-table th,
.openings-table td {
  padding: 10px 14px;
  text-align: left;
  border-bottom: 1px solid var(--line);
}

.openings-table th {
  font-weight: 600;
  color: var(--text);
  background: #f8fafc;
}

.openings-table td:first-child {
  width: 150px;
  font-weight: 600;
  white-space: nowrap;
}

.openings-table tr:hover td {
  background: var(--hover);
}

@media (max-width: 600px) {
  .openings-table th,
  .openings-table td {
    padding: 8px;
  }

  .openings-table td:first-child {
    width: 85px;
  }
}

    /* Contenuto */

    header {
      padding: 20px 24px 12px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .toolbar button {
      padding: 6px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: white;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .toolbar button:hover {
      background: var(--hover);
    }

    main {
      padding: 8px 24px 48px;
    }

    #tree {
      max-width: 1400px;
    }

    /* Albero dichiarativo */

    .node-children {
      margin-left: 22px;
      padding-left: 16px;
      border-left: 1px solid var(--line);
    }

    .node-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      min-height: 36px;
      padding: 3px 6px;
      border-radius: 4px;
    }

    .node-row:hover {
      background: var(--hover);
    }

    .toggle,
    .toggle-placeholder {
      flex: 0 0 20px;
      width: 20px;
    }

    .toggle {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 17px;
      cursor: pointer;
    }

    .toggle:hover {
      color: var(--text);
    }

    .toggle:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .bid {
      flex-shrink: 0;
      font-weight: 600;
      white-space: nowrap;
    }

    .description {
      min-width: 0;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .suit {
      font-weight: 600;
    }

    .club {
      color: var(--club);
    }

    .diamond {
      color: var(--diamond);
    }

    .heart {
      color: var(--heart);
    }

    .spade {
      color: var(--spade);
    }

    .hidden {
      display: none;
    }

    .intro-content {
      max-width: 900px;
      white-space: pre-wrap;
      color: var(--muted);
    }

    .error {
      color: #b91c1c;
      padding: 16px;
    }

    @media (max-width: 600px) {
      body {
        font-size: 16px;
      }

      .tabs {
        gap: 6px;
        padding: 8px;
      }

      .tab {
        padding: 7px 12px;
        font-size: 16px;
      }

      header {
        padding: 16px 14px 10px;
      }

      main {
        padding: 8px 10px 32px;
      }

      h1 {
        font-size: 21px;
      }

      .node-children {
        margin-left: 10px;
        padding-left: 10px;
      }

      .node-row {
        gap: 4px;
        padding: 3px 2px;
      }
    }
  </style>
</head>

<body>

  <nav class="tabs-container" aria-label="Sezioni del sistema">
    <div id="tabs" class="tabs"></div>
  </nav>

  <header>
    <h1 id="pageTitle">Sistema dichiarativo di bridge</h1>

    <div id="toolbar" class="toolbar">
      <button id="expandAll" type="button">
        Espandi tutto
      </button>

      <button id="collapseAll" type="button">
        Comprimi tutto
      </button>
    </div>
  </header>

  <main>
    <div id="tree"></div>
  </main>

  <script>
    let system = { tabs: [] };
    let activeTabId = null;

    // Conserva lo stato di espansione di ogni tab.
    const expandedNodes = new Map();

    const tabsContainer = document.getElementById("tabs");
    const tree = document.getElementById("tree");
    const pageTitle = document.getElementById("pageTitle");
    const toolbar = document.getElementById("toolbar");

    // --------------------------------------------------
    // COLORI DEI SEMI
    // --------------------------------------------------

    function formatSuits(text) {
      const fragment = document.createDocumentFragment();
      const suitRegex = /[♣♦♥♠]/g;

      let lastIndex = 0;
      let match;

      while ((match = suitRegex.exec(text)) !== null) {
        fragment.appendChild(
          document.createTextNode(
            text.slice(lastIndex, match.index)
          )
        );

        const span = document.createElement("span");

        const classes = {
          "♣": "club",
          "♦": "diamond",
          "♥": "heart",
          "♠": "spade"
        };

        span.className = "suit " + classes[match[0]];
        span.textContent = match[0];

        fragment.appendChild(span);

        lastIndex = match.index + match[0].length;
      }

      fragment.appendChild(
        document.createTextNode(text.slice(lastIndex))
      );

      return fragment;
    }

    // --------------------------------------------------
    // STATO DEI NODI
    // --------------------------------------------------

    function getExpandedSet(tabId) {
      if (!expandedNodes.has(tabId)) {
        expandedNodes.set(tabId, new Set());
      }

      return expandedNodes.get(tabId);
    }

    function isExpanded(nodeId) {
      return getExpandedSet(activeTabId).has(nodeId);
    }

    function setExpanded(nodeId, expanded) {
      const state = getExpandedSet(activeTabId);

      if (expanded) {
        state.add(nodeId);
      } else {
        state.delete(nodeId);
      }

      const children = document.getElementById(
        "children-" + nodeId
      );

      const button = document.getElementById(
        "toggle-" + nodeId
      );

      if (children) {
        children.classList.toggle("hidden", !expanded);
      }

      if (button) {
        button.textContent = expanded ? "⌄" : "›";

        button.setAttribute(
          "aria-expanded",
          String(expanded)
        );
      }
    }

    // --------------------------------------------------
    // CREAZIONE DEI NODI DELL'ALBERO
    // --------------------------------------------------

    function createNode(node) {
      const container = document.createElement("div");
      container.className = "node";

      const row = document.createElement("div");
      row.className = "node-row";

      const hasChildren =
        Array.isArray(node.children) &&
        node.children.length > 0;

      if (hasChildren) {
        const toggle = document.createElement("button");

        toggle.className = "toggle";
        toggle.textContent = isExpanded(node.id) ? "⌄" : "›";
        toggle.setAttribute(
          "aria-expanded",
          String(isExpanded(node.id))
        );
        toggle.type = "button";
        toggle.id = "toggle-" + node.id;

        toggle.setAttribute(
          "aria-label",
          "Espandi " + node.bid
        );

        toggle.addEventListener("click", () => {
          setExpanded(node.id, !isExpanded(node.id));
        });

        row.appendChild(toggle);
      } else {
        const placeholder = document.createElement("span");
        placeholder.className = "toggle-placeholder";

        row.appendChild(placeholder);
      }

      const bid = document.createElement("span");
      bid.className = "bid";
      bid.appendChild(formatSuits(node.bid || ""));

      row.appendChild(bid);

      const description = document.createElement("span");
      description.className = "description";

      description.appendChild(
        formatSuits(node.description || "")
      );

      row.appendChild(description);
      container.appendChild(row);

      if (hasChildren) {
        const childrenContainer = document.createElement("div");

        childrenContainer.className = "node-children";
        childrenContainer.id = "children-" + node.id;

        node.children.forEach(child => {
          childrenContainer.appendChild(createNode(child));
        });

        container.appendChild(childrenContainer);
      }

      return container;
    }

    // --------------------------------------------------
    // VISUALIZZAZIONE DELL'ALBERO
    // --------------------------------------------------

    function renderTree(data) {
      tree.replaceChildren();

      data.forEach(node => {
        tree.appendChild(createNode(node));
      });

      // Ripristina lo stato di espansione.
      tree.querySelectorAll(".node").forEach(container => {
        const button = container.querySelector(
          ":scope > .node-row .toggle"
        );

        if (!button) return;

        const nodeId = button.id.replace("toggle-", "");

        if (isExpanded(nodeId)) {
          setExpanded(nodeId, true);
        }
      });
    }

    // --------------------------------------------------
    // NAVIGAZIONE TRA I TAB
    // --------------------------------------------------
function renderTable(data) {
  tree.replaceChildren();

  const table = document.createElement("table");
  table.className = "openings-table";

  // Intestazione
  const thead = document.createElement("thead");
  const headerRow = document.createElement("tr");

  data.columns.forEach(column => {
    const th = document.createElement("th");
    th.textContent = column;
    headerRow.appendChild(th);
  });

  thead.appendChild(headerRow);
  table.appendChild(thead);

  // Contenuto
  const tbody = document.createElement("tbody");

  data.rows.forEach(row => {
    const tr = document.createElement("tr");

    const bid = document.createElement("td");
    bid.appendChild(formatSuits(row.bid));

    const meaning = document.createElement("td");
    meaning.appendChild(formatSuits(row.meaning));

    tr.appendChild(bid);
    tr.appendChild(meaning);

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  tree.appendChild(table);
}

    
    async function selectTab(tabId) {
  activeTabId = tabId;

  const tab = system.tabs.find(
    item => item.id === tabId
  );

  if (!tab) return;

  tabsContainer.querySelectorAll(".tab").forEach(button => {
    const active = button.dataset.tabId === tabId;

    button.classList.toggle("active", active);
    button.setAttribute("aria-selected", String(active));
  });

  pageTitle.textContent = tab.title;
  tree.replaceChildren();

  // Introduzione
  if (tab.type === "intro") {
    toolbar.classList.add("hidden");

    const content = document.createElement("div");
    content.className = "intro-content";
    content.textContent = tab.content || "";

    tree.appendChild(content);
    return;
  }

  // Le tabelle non hanno nodi espandibili
  if (tab.type === "table") {
    toolbar.classList.add("hidden");
  } else {
    toolbar.classList.remove("hidden");
  }

  try {
    const response = await fetch(tab.src);

    if (!response.ok) {
      throw new Error("Errore HTTP " + response.status);
    }

    const data = await response.json();

    // Evita di mostrare un contenuto se nel frattempo
    // l'utente ha selezionato un altro tab.
    if (activeTabId !== tabId) return;

    if (tab.type === "table") {
      renderTable(data);
    } else if (tab.type === "opening") {
      renderTree(data.children || []);
    }

  } catch (error) {
    console.error(error);

    if (activeTabId !== tabId) return;

    const message = document.createElement("p");
    message.className = "error";
    message.textContent =
      "Errore nel caricamento di " + tab.src +
      ": " + error.message;

    tree.appendChild(message);
  }
}

    function renderTabs() {
      tabsContainer.replaceChildren();

      system.tabs.forEach(tab => {
        const button = document.createElement("button");

        button.className = "tab";
        button.type = "button";
        button.appendChild(formatSuits(tab.title));
        button.dataset.tabId = tab.id;

        button.setAttribute("role", "tab");
        button.setAttribute("aria-selected", "false");

        button.addEventListener("click", () => {
          selectTab(tab.id);
        });

        tabsContainer.appendChild(button);
      });

      // Seleziona automaticamente il primo tab.
      if (system.tabs.length > 0) {
        selectTab(system.tabs[0].id);
      }
    }

    // --------------------------------------------------
    // ESPANDI / COMPRIMI TUTTO
    // --------------------------------------------------

    function setAllExpanded(expanded) {
      const tab = system.tabs.find(
        item => item.id === activeTabId
      );

      if (!tab || tab.type === "intro") return;

      function visit(nodes) {
        nodes.forEach(node => {
          if (node.children && node.children.length > 0) {
            setExpanded(node.id, expanded);
            visit(node.children);
          }
        });
      }

      visit(tab.children || []);
    }

    document.getElementById("expandAll")
      .addEventListener("click", () => {
        setAllExpanded(true);
      });

    document.getElementById("collapseAll")
      .addEventListener("click", () => {
        setAllExpanded(false);
      });

    // --------------------------------------------------
    // CARICAMENTO DEL JSON
    // --------------------------------------------------

    async function loadSystem() {
      try {
        const response = await fetch("./system.json");

        if (!response.ok) {
          throw new Error(
            "Errore nel caricamento del JSON: " + response.status
          );
        }

        system = await response.json();

        if (!Array.isArray(system.tabs)) {
          throw new Error(
            "Il JSON deve contenere un array 'tabs'."
          );
        }

        renderTabs();

      } catch (error) {
        console.error(error);

        tree.innerHTML = "";

        const message = document.createElement("p");
        message.className = "error";
        message.textContent =
          "Impossibile caricare il sistema dichiarativo. " +
          "Controlla che system.json esista e sia valido.";

        tree.appendChild(message);
      }
    }

    loadSystem();
  </script>

</body>
</html>
